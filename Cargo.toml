[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
license = "MIT"
edition = "2021"
rust-version = "1.87"
repository = "https://github.com/zx-sidekick/zx-sidekick"

# The machine comes from the zx-sidekick fork of RustZX. Both crates are pinned to the same
# commit, so rustzx-core is built on the patched processor. Bump the rev after each patch lands
# there; never follow the branch. To work on the fork alongside this repository, see
# "Working on the engine" in ZX-SIDEKICK.md.
[workspace.dependencies]
directories = "6.0.0"
swash = "0.2.10"
tiny-skia = { version = "0.12.0", default-features = false, features = ["std"] }
sidekick-ui = { path = "crates/sidekick-ui" }
miniz_oxide = "0.9.1"
sdl3 = { version = "0.20.0", features = ["build-from-source-static"] }
sidekick-core = { path = "crates/sidekick-core" }
clap = { version = "4.6.7", features = ["derive"] }
sidekick-def = { path = "crates/sidekick-def" }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
tempfile = "3.27.0"
toml = "1.1.8"
zip = { version = "9.0.1", default-features = false, features = ["deflate"] }
rhai = { version = "1.26.1", default-features = false, features = ["std", "only_i64", "no_module", "no_time", "no_custom_syntax"] }
sidekick-script = { path = "crates/sidekick-script" }
rustzx-core = { git = "https://github.com/zx-sidekick/rustzx", rev = "50835cbd14be8dc980ff893447d8827e57f20fb1", features = ["embedded-roms", "ay", "zlib", "precise-border", "autoload"] }
rustzx-z80 = { git = "https://github.com/zx-sidekick/rustzx", rev = "50835cbd14be8dc980ff893447d8827e57f20fb1" }

# The strictest useful setting: clippy's pedantic, nursery and cargo groups, plus the
# restriction lints that suit this code. CI denies warnings. A lint allowed has its reason beside it.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_qualifications = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Contradicts rustc's `unreachable_pub`, which asks for `pub(crate)` where this asks for `pub`.
redundant_pub_crate = "allow"
allow_attributes_without_reason = "warn"
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
get_unwrap = "warn"
if_then_some_else_none = "warn"
print_stderr = "warn"
print_stdout = "warn"
rc_buffer = "warn"
redundant_type_annotations = "warn"
str_to_string = "warn"
string_lit_chars_any = "warn"
todo = "warn"
try_err = "warn"
unimplemented = "warn"
unneeded_field_pattern = "warn"
unwrap_used = "warn"
