[workspace]
resolver = "3"
members = [
    "crates/zx-core",
    "crates/zx-spectrum",
    "crates/sidekick",
    "crates/sidekick-frontend",
    "games/starquake/starquake",
    "games/starquake/check",
    "games/starquake/lab",
    "games/starquake/app",
    "games/manicminer/manicminer",
    "games/manicminer/check",
    "games/manicminer/app",
]

[workspace.package]
# The shared crates' version. Each game's crates carry the game's own, the
# same in all of them, which its release tag names (#132).
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
# Nothing here belongs on crates.io: the program needs the player's own copy
# of the game to do anything.
publish = false

[workspace.dependencies]
zx-core = { path = "crates/zx-core" }
zx-spectrum = { path = "crates/zx-spectrum" }
sidekick = { path = "crates/sidekick" }
sidekick-frontend = { path = "crates/sidekick-frontend" }
starquake = { path = "games/starquake/starquake" }
manicminer = { path = "games/manicminer/manicminer" }

# Everything from outside, declared once here with its version and features,
# so a bump is one line and no two packages drift apart (#145).
#
# The processor, our fork of rustzx-z80, pinned to a commit.
rustzx-z80 = { git = "https://github.com/zx-sidekick/rustzx", rev = "a73772d78dec4dde9e7f308a64d9c6021e167f74" }
# Deflate for the PNGs and the planet picture: the pure-Rust backend only.
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
# The window, its pixels, sound and gamepads.
pixels = "0.17"
winit = "0.30"
cpal = "0.18"
gilrs = "0.11"
# Reading the tape out of the zip the archives serve it in. Deflate only,
# through the pure-Rust zlib; the other methods and encryption stay out.
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# Text in the bundled Inter, and the system's own dialogs.
fontdue = "0.9"
rfd = "0.17"

# The whole game runs on an emulated processor, so even dev builds need
# optimising to keep up with a real Spectrum.
[profile.dev]
opt-level = 2

[profile.dev.build-override]
opt-level = 3

[profile.release.build-override]
opt-level = 3

# Clippy's default set, plus the pedantic lints that earn their keep here.
# No unsafe code anywhere (#77): the processor is our fork's, the bus and
# everything above it is safe Rust, and the one Win32 call there was went
# through a safe crate.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
missing_panics_doc = "warn"
missing_errors_doc = "warn"
items_after_statements = "warn"
match_same_arms = "warn"
if_not_else = "warn"
default_trait_access = "warn"
needless_pass_by_value = "warn"
semicolon_if_nothing_returned = "warn"
redundant_closure_for_method_calls = "warn"
wildcard_imports = "warn"
