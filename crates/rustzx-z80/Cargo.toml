[package]
name = "rustzx-z80"
description = "Z80 CPU emulator library"
keywords = ["emulator", "z80", "no_std"]
# rustzx-z80 0.16.0 from rustzx (https://github.com/rustzx/rustzx), with the
# patches its README lists; brought in from our fork, zx-sidekick/rustzx, at
# 2992611 (#193). Its own version, licence and authors, not the workspace's.
version = "0.16.0"
license = "MIT"
edition = "2021"
authors = ["The RustZX contributors", "Vladyslav Nikonov <mail@pacmancoder.xyz>"]
repository = "https://github.com/rustzx/rustzx"
publish = false
# `cast_signed` needs 1.87, `#[expect]` 1.81.
rust-version = "1.87"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
# A Z80 works in 8 and 16 bits: taking the low byte of a wider result (`temp as u8`) is how its
# arithmetic is written, not an accident.
cast_possible_truncation = "allow"
