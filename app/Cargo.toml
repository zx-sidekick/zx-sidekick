[package]
name = "zx-sidekick-starquake"
description = "ZX Sidekick: Starquake, running your own copy of the original game. Not affiliated with the rights holders."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
sidekick.workspace = true
zx-core.workspace = true
zx-spectrum.workspace = true
pixels = "0.17"
winit = "0.30"
cpal = "0.18"
gilrs = "0.11"
# Reading the tape out of the zip the archives serve it in. Deflate only,
# through the pure-Rust zlib; the other methods and encryption stay out.
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# The screen that asks for the tape: text in the bundled Inter (see fonts/),
# and the system's own open-file dialog.
fontdue = "0.9"
rfd = "0.17"

# Only for putting a fatal startup error in a message box, since a Windows
# build has no console to print it to. Nothing else uses it.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }

[lints]
workspace = true
