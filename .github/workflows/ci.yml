name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # The repository must never carry any part of the original game. This is
  # the one check that protects the project's whole footing, so it runs
  # first and on its own.
  no-game-data:
    name: no game or ROM data committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Nothing under assets/ but its README
        run: |
          stray=$(git ls-files assets | grep -v '^assets/README\.md$' || true)
          if [ -n "$stray" ]; then
            echo "::error::These must never be committed:"
            echo "$stray"
            exit 1
          fi

      - name: No game dumps anywhere in the tree
        run: |
          stray=$(git ls-files | grep -iE '\.(tap|tzx|z80|sna|rom|szx)$' || true)
          if [ -n "$stray" ]; then
            echo "::error::Game or ROM dumps must never be committed:"
            echo "$stray"
            exit 1
          fi

  build:
    name: build, test and lint (${{ matrix.os }})
    # Every `run:` below is a bash script. Windows runners default to
    # PowerShell, so say it once here rather than on each step.
    defaults:
      run:
        shell: bash
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      # Keep in step with rust-toolchain.toml, which pins the same version
      # for local builds. Tracking `stable` here would mean a future Rust
      # release could fail CI on untouched code, because `clippy -D warnings`
      # gains lints with every release.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # What the window, sound and gamepad crates need to build on Linux.
      - name: System libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libxkbcommon-dev \
            libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev

      - name: Build
        run: cargo build --workspace --all-targets --locked

      # The Z80 conformance corpus is the Fuse project's, under the GPL, so it
      # is fetched rather than committed — the same reason the game and the
      # ROM are not here. Pinned by hash, so a changed file is caught rather
      # than quietly changing what we test against.
      #
      # The cache key IS the pin, so a hit can only be the bytes we asked for
      # and a change to either hash misses and re-fetches. That keeps a
      # SourceForge outage from turning `main` red on an unrelated change.
      - name: Cache the Z80 test corpus
        id: corpus
        uses: actions/cache@v4
        with:
          path: |
            assets/tests.in
            assets/tests.expected
          key: fuse-z80-corpus-fec4e44d-207dc604

      - name: Fetch the Z80 test corpus
        if: steps.corpus.outputs.cache-hit != 'true'
        run: |
          base='https://sourceforge.net/p/fuse-emulator/code/HEAD/tree/trunk/fuse/z80/tests'
          curl -fsSL --retry 3 -o assets/tests.in "$base/tests.in?format=raw"
          curl -fsSL --retry 3 -o assets/tests.expected "$base/tests.expected?format=raw"

      # Verified whether it was downloaded or restored: a cache can be
      # poisoned, and the pin is worth nothing if it is only checked on the
      # path that was already trustworthy.
      - name: Verify the Z80 test corpus
        run: |
          # macOS ships `shasum`, Linux and git-bash ship `sha256sum`, and
          # neither ships both. Ask for whichever is there.
          if command -v sha256sum > /dev/null; then
            check="sha256sum -c -"
          else
            check="shasum -a 256 -c -"
          fi
          printf '%s  %s\n' \
            fec4e44dfa4fa889f976aa546a774d48c2a7366ab12312d449f79e85e68d77d7 assets/tests.in \
            207dc604db5d2a0a49ebd40e1bcb985a919e7a6e3dea1a52884ee05f9a1bf005 assets/tests.expected \
            | $check

      - name: Test
        run: cargo test --workspace --locked

      # The conformance test passes when the corpus is absent, so prove it
      # actually ran rather than trusting that the step above worked.
      - name: Z80 conformance ran
        run: |
          cargo test -p zx-spectrum --test fuse --locked -- --nocapture \
            | tee /tmp/fuse.log
          grep -q 'Z80 corpus: 1329/1335 cases match exactly, 6 more differ only in the undocumented bits 3 and 5 of F' /tmp/fuse.log
          grep -q 'Z80 bus activity: 1335/1335 cases match' /tmp/fuse.log

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
