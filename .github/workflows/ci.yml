name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly, so an outside break (a Rust release, a moved action) shows up between PRs.
    - cron: '17 5 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Job names are the ruleset's required checks (.github/rulesets/main.json):
# renaming one means updating the ruleset in the same PR.
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: scripts/linux-deps.sh
      # Pinned, as in the rustzx fork: pedantic lints are on, so a new clippy lint
      # can't fail every PR at once. Move it on purpose.
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: scripts/check.sh guard package notes fmt clippy

  # The program built and tested on each platform it ships for, SDL3 built from source into
  # it. Packed ready to run (scripts/package.sh) and kept as an artifact, to try a pull
  # request's build.
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-24.04
            binary: sidekick
          - name: macos
            os: macos-15
            binary: sidekick
          - name: windows
            os: windows-2025
            binary: sidekick.exe
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - if: matrix.name == 'linux'
        run: scripts/linux-deps.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - run: cargo test --workspace
      - run: cargo build --release -p sidekick
      - run: scripts/package.sh target/release/${{ matrix.binary }} ${{ matrix.name }}
        shell: bash
      - uses: actions/upload-artifact@v7
        with:
          name: sidekick-${{ matrix.name }}
          path: target/package/zx-sidekick-*
          retention-days: 7
