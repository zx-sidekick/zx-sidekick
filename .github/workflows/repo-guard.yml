name: Repo guard and checks

# No tape, snapshot or ROM file may ever be committed (CLAUDE.md, "Working with copyrighted game
# code"). The ROM the emulator needs comes inside the rustzx-core dependency.
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  guard:
    name: "No game or ROM files"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Refuse tapes, snapshots and ROMs
        run: |
          found=$(git ls-files | grep -iE '\.(tap|tzx|z80|sna|szx|rom)$' || true)
          if [ -n "$found" ]; then
            echo "These must not be committed:"
            echo "$found"
            exit 1
          fi

  check:
    name: "Format, clippy and tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Pinned, as in the fork: pedantic lints are on, so a new clippy lint can't fail every PR.
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
