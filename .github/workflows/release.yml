# Builds Starquake's program when one of its tags is pushed (starquake-v0.3.0,
# or starquake-v0.3.0-rc.1 for a candidate; #132), and attaches the
# binaries to a GitHub release.
#
# A binary is less useful here than it would be for most games: it still needs
# the player's own copy of Starquake to run, and asks for one before it starts.
# It saves them installing Rust, and that is all it saves them. See
# games/starquake/docs/player/README.txt.
#
# Linux, macOS and Windows — the same three CI builds and tests on. A target
# is only shipped once something proves it works.

name: Release

on:
  push:
    tags:
      - "starquake-v*"
  # So the build can be exercised without minting a tag.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # Every `run:` below is a bash script; Windows would otherwise use
    # PowerShell.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          # Cross-compiled: GitHub no longer has Intel macOS runners, and a
          # job asking for `macos-13` waits in the queue forever. The smoke
          # test below runs the result under Rosetta.
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      # What the window, sound and gamepad crates need to build on Linux.
      - name: System libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libxkbcommon-dev \
            libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev

      - name: Build
        run: cargo build --release --locked -p zx-sidekick-starquake --target ${{ matrix.target }}

      # Proves the binary starts on its runner: from an empty folder it must
      # say it found no tape and exit 1, which is as far as it gets without
      # one. Headless, because a windowed start with no tape opens a window to
      # ask for it, and a runner has no display. Not on Windows, where a release build says that in a dialog box
      # and the job would wait for somebody to close it.
      - name: Smoke test
        if: runner.os != 'Windows'
        run: |
          bin="$PWD/target/${{ matrix.target }}/release/zx-sidekick-starquake"
          empty=$(mktemp -d)
          cd "$empty"
          set +e
          out=$(HOME="$empty" XDG_DATA_HOME="$empty" "$bin" --headless 1 "$empty/shots" 2>&1)
          code=$?
          set -e
          echo "$out"
          [ "$code" -eq 1 ] && grep -q "no copy of Starquake found" <<< "$out"

      # Named for the target, since four of these land in one release. A
      # tarball everywhere but Windows, where a zip is what Explorer opens
      # without being asked twice.
      - name: Package
        run: |
          # A tag is a plain name, but a branch can carry slashes, and the
          # whole point of workflow_dispatch is trying this before a tag
          # exists. `mkdir zx-sidekick-starquake-feat/thing-x86_64-...` fails.
          ref="${GITHUB_REF_NAME//\//-}"
          # The archive already names the game: zx-sidekick-starquake-v0.3.0-...
          ref="${ref#starquake-}"
          dir="zx-sidekick-starquake-$ref-${{ matrix.target }}"
          mkdir "$dir"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/${{ matrix.target }}/release/zx-sidekick-starquake.exe "$dir/"
          else
            cp target/${{ matrix.target }}/release/zx-sidekick-starquake "$dir/"
          fi
          # The player's guide, not the repository README, which is about
          # working on the code. Plain text, because anyone can open it.
          cp games/starquake/docs/player/* "$dir/"
          cp LICENSE-MIT LICENSE-APACHE "$dir/"
          cp THIRD-PARTY.md "$dir/THIRD-PARTY.txt"
          # The font the program draws its own screens in travels with its
          # licence, as the OFL asks.
          cp games/starquake/app/fonts/LICENSE.txt "$dir/LICENSE-Inter.txt"
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip "$dir.zip" "$dir" > /dev/null
            echo "ASSET=$dir.zip" >> "$GITHUB_ENV"
          else
            tar czf "$dir.tar.gz" "$dir"
            echo "ASSET=$dir.tar.gz" >> "$GITHUB_ENV"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}

  release:
    name: attach to the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      # The whole history with its tags, for the list of what changed.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      # What changed, from the commit messages (#124), then what the player
      # needs to know: they still need their own tape, and saying so at the
      # point of download saves somebody a confusing first run.
      - name: release notes
        run: |
          {
            echo "Built from \`$GITHUB_REF_NAME\`."
            echo
            echo "## What changed"
            echo
            scripts/changelog.sh --notes "$GITHUB_REF_NAME"
            echo
            cat <<'NOTES'
          **You need your own copy of Starquake to play.** ZX Sidekick contains no part of the original game: it runs your tape, unchanged. README.txt in the archive says where to find one. Not affiliated with or endorsed by the rights holders.

          Run the program and it asks for the tape, or put `starquake.tap` in the same folder first. You can also give the tape on the command line: `./zx-sidekick-starquake path/to/starquake.tap`, or `zx-sidekick-starquake.exe path\to\starquake.tap` on Windows.

          **macOS:** the binary is not signed, so macOS blocks it the first time you run it. In Terminal, in the folder you extracted, run `xattr -d com.apple.quarantine zx-sidekick-starquake`. Or try to open it once, then allow it under System Settings, Privacy & Security.

          **Gamepads** are the Kempston joystick: choose 1 on the title screen. The guidance shows the letters of the pad you have: Xbox, Switch or PlayStation.

          `THIRD-PARTY.txt` in the archive lists the libraries built into the program and their licences.
          NOTES
          } > notes.md

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            *.tar.gz
            *.zip
          body_path: notes.md
          fail_on_unmatched_files: true
          # A candidate, like starquake-v0.3.0-rc.1, is something to try before
          # the real one, so it is published as a pre-release and never
          # becomes the latest release.
          # Every tag has a dash after the game's name, so look for -rc.
          prerelease: ${{ contains(github.ref_name, '-rc') }}
