# cargo-about's settings for licenses/THIRD-PARTY-NOTICES.txt (scripts/notices.sh).

# The licences a crate may be under. Where a crate offers a choice, the first one here is taken.
# A crate under none of them fails the release until it is looked at and added.
accepted = [
    "MIT",
    "Apache-2.0",
    "Zlib",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "HPND",
    "SunPro",
]
# The platforms the releases are built for (ZX-SIDEKICK.md, "Releases"), so every archive
# carries the same file and it covers each platform's crates.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
ignore-dev-dependencies = true
# The workspace's own crates: they're under LICENSE, packed beside the program.
private = { ignore = true }

# SDL3 is compiled into the program from the source in sdl3-src. Pinned here, rather than the
# zlib notice at the top of each of SDL's own files: the crate's licence, SDL3's, those of
# HIDAPI (offered under a choice of three; the BSD one is taken) and yuv2rgb, then every other
# notice in the source of a file built for a platform the program ships on, verbatim from
# `start` through `end`. Where several files carry the same notice, one stands for them all.
# scripts/check.sh's package step names any copyright line in that source the notices lack.
# A checksum that no longer matches stops scripts/notices.sh: read the text again and update it
# (the SHA-256 of the file, or of the text from `start` through `end`, both included).
[sdl3-src.clarify]
license = "Zlib AND BSD-3-Clause AND MIT AND Apache-2.0 AND HPND AND SunPro"

