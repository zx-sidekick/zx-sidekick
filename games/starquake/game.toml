# Starquake, ZX Sidekick's reference definition.
#
# A draft: its shape is complete, but every fact still to be found is a commented-out line marked
# TODO, so this parses but won't pass `sidekick check` yet. Facts are found under CLAUDE.md's
# rules and written up in docs/re/starquake.md; docs/games/starquake.md says what each is for.
# Facts only: nothing of the game's code, graphics, maps or text belongs in this file.

schema = 1

[game]
id = "starquake"
title = "Starquake"
year = 1985
publisher = "Bubble Bus Software"
authors = ["Stephen Crow"]
machine = "48k"

[[media]]
name = "Starquake (Bubble Bus Software), as distributed by World of Spectrum"
sha1 = "65450d6f33692c2c2868c0b497037f2cfd0ef3bd"
files = ["STARQUAK.TAP", "Starquake.tap.zip"]
download = "https://worldofspectrum.net/item/0004873"
download_label = "World of Spectrum"

[run]
# The main loop's call to its wait for the next frame: passed once a frame in play.
sync = 0xA523
# Its own loader already waits for a key on the loading screen (docs/re/starquake.md).
hold_loading_screen = false
joystick = "kempston"

# States, checked in this order; the first that matches is the game's state.

[[states]]
name = "paused"
# SPACE pauses: the game waits for it to be let go, then for any move or fire.
pc = [0xC5AF, 0xC5B5]
# In the original, any move or fire goes on once the pause key is let go (docs/games/starquake.md).
notice = { text = "Move or fire to go on.", hints = [
  { pad = "dpad", does = "move" },
  { pad = "west", does = "fire" },
] }

[[states]]
name = "booth"
# The booth's wait for each letter of a code (docs/re/starquake.md).
pc = [0xCF93, 0xCF9A]

[[states]]
name = "door"
# The card routine's loop, reached once a door's cards are worked out; the main loop waits
# meanwhile, so the values are read at the frame's end, cards and all (docs/re/starquake.md).
pc = 0xD64E

[[states]]
name = "game_over"
# Entered when the last life is lost, or A S D F G are held together.
pc = 0x64A0

[[states]]
name = "play"
pc = 0xA523

[[states]]
name = "title"
# The menu's loop, passed every few frames once its tune has played.
pc = 0x5FF4

# Values. Each needs its address and type confirmed.

[values.room]
type = "u16"
addr = 0xD2C8
description = "The room BLOB is in: 16 to a row, 0 at the top left"

[values.blob_x]
type = "u8"
addr = 0xDD1D
description = "BLOB's left edge, in pixels"

[values.blob_y]
type = "u8"
addr = 0xDD1E

[values.lives]
type = "u8"
writable = true
addr = 0xD2CC

[values.energy]
type = "u8"
writable = true
addr = 0xD2CD
max = 127

[values.platforms]
type = "u8"
writable = true
addr = 0xD2CE
max = 127

[values.laser]
type = "u8"
writable = true
addr = 0xD2CF
max = 127

[values.visited]
type = "bitset"
# addr = TODO
# len = TODO
description = "Rooms visited, kept by the game for its first-visit bonus"

[values.booth_code]
type = "text"
len = 5
addr = 0xCF3D
description = "The code of the booth BLOB is in, as the booth shows it"

[values.items]
type = "table"
addr = 0x94E8
count = 45
stride = 4
# Packed: x in the low five bits of the first byte, its color in the top three; y in the low
# seven bits of the second (0 not yet placed, 1 picked up), the room's ninth bit in its top.
fields.first = { offset = 0, type = "u8" }
fields.second = { offset = 1, type = "u8" }
fields.room_low = { offset = 2, type = "u8" }
fields.picture = { offset = 3, type = "u8" }
description = "The items, each in a room until picked up"

[values.carried]
type = "table"
addr = 0xD2D2
count = 4
stride = 2
fields.picture = { offset = 0, type = "u8" }
fields.color = { offset = 1, type = "u8" }
description = "What BLOB carries: four slots, a slot empty when its color is 0"

[values.core_slots]
type = "table"
addr = 0xD2DE
count = 9
stride = 1
fields.slot = { offset = 0, type = "u8" }
fields.missing = { offset = 0, type = "u8", bits = 0x80 }
description = "The core's slots: the picture each wants (the low seven bits), missing while bit 7 is set"

[values.pieces_missing]
type = "u8"
addr = 0xD2E7
description = "Core pieces still to deliver: 9 at the start"

[values.teleports]
type = "table"
addr = 0xD036
count = 15
stride = 7
fields.code = { offset = 0, type = "text", len = 5 }
fields.room = { offset = 5, type = "u16" }
description = "Each teleport's code and the room it goes to"

[values.door_cards]
type = "bytes"
addr = 0xD5F7
len = 5
description = "The last security door's three cards, at every other byte: pictures 9 to 13"

[values.play_area]
type = "bytes"
addr = 0x58C0
len = 576
description = "The play area's attributes, 32 a row, 18 rows: a cell without BRIGHT blocks BLOB"

[values.door_card_count]
type = "u8"
addr = 0xD5F6
description = "How many cards the card routine asks for: 3 at a security door"

[values.seed]
type = "u16"
addr = 0xD2C6
description = "The game's seed, set at its start: with a room, it decides that room's door cards"

[values.map]
type = "bytes"
# addr = TODO
# len = TODO
description = "The room map, read once by the script's on_load"

[values.font]
type = "font"
addr = 0xADD4
first = 0x20
count = 59
width = 8
height = 8

[values.item_pictures]
type = "sprites"
addr = 0x9088
count = 35
width = 16
height = 16
layout = "cells"

# Training switches.

[[cheats]]
id = "full-energy"
label = "Full energy"
set = { value = "energy", to = "max" }

[[cheats]]
id = "full-platforms"
label = "Full bridging platforms"
set = { value = "platforms", to = "max" }

[[cheats]]
id = "full-laser"
label = "Full laser"
set = { value = "laser", to = "max" }

[[cheats]]
id = "endless-lives"
label = "Endless lives"
hold = "lives"

[[cheats]]
id = "no-harm"
label = "No harm from enemies"
# Skips the call that hurts BLOB when a creature touches him (docs/re/starquake.md).
patch = [{ addr = 0xA56A, bytes = "00 00 00", expect = "C4 50 C3" }]
note = "Stops creatures taking energy, and so lives, when they touch BLOB."

# The pad.

[pad.default]
dpad = "joystick"
stick = "joystick"
west = "fire"
south = "build"
east = "pick-up"
north = "next-route"
start = { tap = ["P"], frames = 2 }

[pad.title]
# start = TODO: the key that starts a game from the title screen

[[actions]]
id = "end-game"
label = "End this game"
tap = ["A", "S", "D", "F", "G"]
frames = 5

[[actions]]
id = "pick-up"
label = "Pick up or swap"
joystick = ["up"]
# patch_for_frame = TODO: skip boarding the hover platform, so up only picks up
note = "Up, meaning only pick up or swap."

[[actions]]
id = "build"
label = "Build a platform"
joystick = ["down"]
# patch_for_frame = TODO: skip flying down, so down only builds
note = "Down, meaning only build."

[[actions]]
id = "next-route"
label = "Next route"
script = "next_route"
host_key = "Tab"

# Typing a teleport code with a pad.

[text_entry]
state = "booth"
letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ"
length = 5
# card_row = TODO: just under the booth's code line
title_choose = "Choose a code"
title_spell = "Spell a code"
choices = "teleport-codes"
choices_from_level = 1
key_down_frames = 1
key_up_frames = 1

[persist.teleport-codes]
label = "teleport codes"
file = "teleporter-codes.txt"
add = "script"

[persist.rooms-walked]
label = "rooms walked"
# One a room: the game's seed, the room, and the edges without an opening, as
# `seed:room:walls` (walls among N, E, S and W). Kept so a continued game shows its map again.
file = "rooms-walked.txt"
add = "script"

[persist.doors-met]
label = "doors met"
# One a door: the game's seed, the room, and its three cards, as `seed:room:card-card-card`.
# Kept so a game continued from a save still lists the doors it met.
file = "doors-met.txt"
add = "script"

[high_scores]
title = "CORE OF HEROES"
# addr = TODO: the table
# count = TODO
# stride = TODO
# name = TODO
# score = TODO

# Guidance: levels 0 to 6, then the panel's widgets.

[[guidance.levels]]
name = "Off"
description = "No guidance. Press Esc or Select to choose a level."

[[guidance.levels]]
name = "Codes and the core"
description = "The teleport codes you've seen, the doors' cards, and the core's pieces."

[[guidance.levels]]
name = "The map you have walked"
description = "A map of the rooms you've visited."

[[guidance.levels]]
name = "What you have seen"
description = "Core pieces still needed, in the rooms you have walked through."

[[guidance.levels]]
name = "What you have not"
description = "Items in the rooms you haven't reached."

[[guidance.levels]]
name = "Routes"
description = "The shortest way to the nearest missing piece, and to the core."

[[guidance.levels]]
name = "Everything"
description = "Every code, every door's cards, and the whole planet."

[[panel]]
kind = "icon-grid"
title = "CORE"
from_level = 1
column = "left"
columns = 3
pictures = "item_pictures"
source = "script:core"

[[panel]]
kind = "chip-list"
title = "TELEPORTS"
from_level = 1
column = "right"
font = "font"
source = "script:teleports"
empty = "None yet"

[[panel]]
kind = "card-set"
title = "DOORS"
from_level = 1
column = "right"
pictures = "item_pictures"
font = "font"
source = "script:doors"
empty = "None yet"

[[panel]]
kind = "map-grid"
from_level = 2
column = "left"
pictures = "item_pictures"
source = "script:map"

[situations]
# The routine that starts play in the current room (docs/re/starquake.md).
enter = 0xA426
# Its loading screen waits for a key; at the title, 0 starts a game.
start = ["SPACE", "0"]

[script]
file = "scripts/starquake.rhai"
