# Starquake, ZX Sidekick's reference definition.
#
# Every fact in it has been seen running on the supported dump. They're found under CLAUDE.md's
# rules and written up in docs/re/starquake.md; docs/games/starquake.md says what each is for.
# Still to find, marked TODO: the high-score table (`[high_scores]`, #171), where the booth's
# card goes (`[text_entry] card_row`, #172), and where the game decides what up and down mean
# (`patch_for_frame`, #20). Until the table is in, `sidekick check` reports its fields as
# missing, and nothing else.
# Facts only: nothing of the game's code, graphics, maps or text belongs in this file.

schema = 1

[game]
id = "starquake"
title = "Starquake"
year = 1985
publisher = "Bubble Bus Software"
authors = ["Stephen Crow"]
machine = "48k"

[[media]]
name = "Starquake (Bubble Bus Software), as distributed by World of Spectrum"
sha1 = "65450d6f33692c2c2868c0b497037f2cfd0ef3bd"
files = ["STARQUAK.TAP", "Starquake.tap.zip"]
download = "https://worldofspectrum.net/item/0004873"
download_label = "World of Spectrum"

[run]
# The main loop's call to its wait for the next frame: passed once a frame in play.
sync = 0xA523
# Its own loader already waits for a key on the loading screen (docs/re/starquake.md).
hold_loading_screen = false
joystick = "kempston"
# It draws nothing in the border, which is one plain colour throughout (docs/re/starquake.md).
border = "none"

# States, checked in this order; the first that matches is the game's state.

[[states]]
name = "paused"
role = "paused"
# SPACE pauses: the game waits for it to be let go, then for any move or fire.
pc = [0xC5AF, 0xC5B5]
# In the original, any move or fire goes on once the pause key is let go (docs/games/starquake.md).
notice = { text = "Move or fire to go on.", hints = [
  { pad = "dpad", does = "move" },
  { pad = "west", does = "fire" },
] }

[[states]]
name = "booth"
# The booth's wait for each letter of a code (docs/re/starquake.md).
pc = [0xCF93, 0xCF9A]

[[states]]
name = "name"
# After a high score, the wait for each of the name's three letters (docs/re/starquake.md).
pc = [0x68DD, 0x68E4]

[[states]]
name = "scores"
# The start of the table's display after a game, once a name is in: passed in one frame, it
# ends the name's state at once, so the table is read back then (docs/re/starquake.md).
pc = 0x654B

[[states]]
name = "door"
# The card routine's loop, at a security door or a pyramid, reached once its cards are worked
# out; the main loop waits meanwhile, so the values are read at the frame's end, cards and all
# (docs/re/starquake.md).
pc = 0xD64E

[[states]]
name = "game_over"
role = "game_over"
# Entered when the last life is lost, or A S D F G are held together.
pc = 0x64A0

[[states]]
name = "play"
role = "play"
pc = 0xA523

[[states]]
name = "title"
role = "title"
# The menu's loop, passed every few frames once its tune has played.
pc = 0x5FF4
# The Kempston joystick chosen for the player whatever the menu's list shows, so the arrows and
# a pad drive BLOB: the game reads the choice when a game starts (docs/re/starquake.md). The
# notice says so over the title's foot, in words that don't need the emulated joystick explained.
set = { value = "controls", to = 1 }
notice = { heading = "Ignore the list", text = "Play with the arrow keys or a gamepad.", hints = [
  { keys = "← ↑ → ↓", pad = "dpad", does = "move" },
  { keys = "Right Ctrl", pad = "west", does = "fire" },
  { keys = "0", pad = "start", does = "start" },
] }

# Values.

[values.controls]
type = "u8"
writable = true
addr = 0x5E58
description = "The title's control choice, 1 to 5 as the keys that pick it: 1 the Kempston joystick. Read when a game starts"

[values.room]
type = "u16"
writable = true
addr = 0xD2C8
description = "The room BLOB is in: 16 to a row, 0 at the top left"

[values.blob_x]
type = "u8"
writable = true
addr = 0xDD1D
description = "BLOB's left edge, in pixels"

[values.blob_y]
type = "u8"
writable = true
addr = 0xDD1E
description = "BLOB's height, in pixels up from the screen's bottom"

[values.lives]
type = "u8"
writable = true
addr = 0xD2CC

[values.energy]
type = "u8"
writable = true
addr = 0xD2CD
max = 127

[values.score]
type = "digits"
len = 6
zero = 0
writable = true
addr = 0xD413
description = "The score, a digit a byte, the most significant first"

[values.platforms]
type = "u8"
writable = true
addr = 0xD2CE
max = 127

[values.laser]
type = "u8"
writable = true
addr = 0xD2CF
max = 127

[values.visited]
type = "bytes"
addr = 0xA390
len = 64
description = "Rooms not yet visited, kept by the game for its first-visit bonus: a bit a room, the first room the top bit of the first byte, cleared on entering"

[values.booth_code]
type = "text"
len = 5
addr = 0xCF3D
description = "The code of the booth BLOB is in, as the booth shows it"

[values.items]
type = "table"
addr = 0x94E8
count = 45
stride = 4
# Packed: x in the low five bits of the first byte, its color in the top three; y in the low
# seven bits of the second (0 not yet placed, 1 to 5 while carried), the room's ninth bit in its
# top.
fields.first = { offset = 0, type = "u8" }
fields.second = { offset = 1, type = "u8" }
fields.room_low = { offset = 2, type = "u8" }
fields.picture = { offset = 3, type = "u8" }
description = "The items, each in a room until picked up"

[values.carried]
type = "table"
addr = 0xD2D2
count = 4
stride = 2
fields.picture = { offset = 0, type = "u8" }
fields.color = { offset = 1, type = "u8" }
description = "What BLOB carries: four slots, a slot empty when its color is 0"

[values.core_slots]
type = "table"
addr = 0xD2DE
count = 9
stride = 1
fields.slot = { offset = 0, type = "u8" }
fields.missing = { offset = 0, type = "u8", bits = 0x80 }
description = "The core's slots: the picture each wants (the low seven bits), missing while bit 7 is set"

[values.pieces_missing]
type = "u8"
addr = 0xD2E7
description = "Core pieces still to deliver: 9 at the start"

[values.teleports]
type = "table"
addr = 0xD036
count = 15
stride = 7
fields.code = { offset = 0, type = "text", len = 5 }
fields.room = { offset = 5, type = "u16" }
description = "Each teleport's code and the room it goes to"

[values.door_cards]
type = "bytes"
addr = 0xD5F7
len = 5
description = "The last security door's three cards, at every other byte: pictures 9 to 13"

[values.play_area]
type = "bytes"
addr = 0x58C0
len = 576
description = "The play area's attributes, 32 a row, 18 rows: a cell without BRIGHT blocks BLOB"

[values.door_card_count]
type = "u8"
addr = 0xD5F6
description = "How many cards the card routine asks for: 3 at a security door, 2 at a pyramid"

[values.seed]
type = "u16"
addr = 0xD2C6
description = "The game's seed, set at its start: with a room, it decides that room's door cards"

[values.interactions]
type = "table"
addr = 0x96FC
count = 22
stride = 3
# Where BLOB's place sets something off: his x and height there, then what it is (a tile's type,
# 1 the room's bonus, 20 and up an item lying there); unused entries are 0 (docs/re/starquake.md).
fields.x = { offset = 0, type = "u8" }
fields.height = { offset = 1, type = "u8" }
fields.kind = { offset = 2, type = "u8" }
description = "What BLOB meets in the room on screen, built as it's drawn"

[values.locked_doors]
type = "table"
addr = 0x95F0
count = 5
stride = 2
fields.room_low = { offset = 0, type = "u8" }
fields.room_high = { offset = 1, type = "u8", bits = 0x80 }
fields.locked = { offset = 1, type = "u8", bits = 0x01 }
description = "The rooms with a locked door's post, each locked until BLOB touches it carrying the key"

[values.rooms]
type = "bytes"
addr = 0x7530
len = 6144
description = "Each room's 4 × 3 large tiles, 12 bytes a room, read once by the script's on_load"

[values.large_tiles]
type = "bytes"
addr = 0x9840
len = 1024
description = "Each large tile's 2 × 2 medium tiles, 4 bytes a tile"

[values.tile_types]
type = "bytes"
addr = 0x9740
len = 256
description = "Each medium tile's type: what it does (top four bits) and where in the tile (the rest)"

[values.tile_pictures]
type = "bytes"
addr = 0xEB23
len = 512
description = "Each medium tile's picture, a word a tile: which cells it draws, their attributes before it"

[values.font]
type = "font"
addr = 0xADD4
first = 0x20
count = 59
width = 8
height = 8

[values.item_pictures]
type = "sprites"
addr = 0x9088
count = 35
width = 16
height = 16
layout = "cells"

# Training switches.

# Each Full switch also patches out the game's calls that take from its bar, so the bar on
# screen stays full too; the set fills a bar already low, and the call redraws the status panel
# so it shows full at once (docs/re/starquake.md).

[[cheats]]
id = "full-energy"
label = "Full energy"
set = { value = "energy", to = "max" }
patch = [{ addr = 0xCB65, bytes = "00 00 00", expect = "CD 1F D4" }]
call = 0xD425

[[cheats]]
id = "full-platforms"
label = "Full bridging platforms"
set = { value = "platforms", to = "max" }
patch = [{ addr = 0xC84C, bytes = "00 00 00", expect = "CD 1F D4" }]
call = 0xD425

[[cheats]]
id = "full-laser"
label = "Full laser"
set = { value = "laser", to = "max" }
patch = [
  { addr = 0xC888, bytes = "00 00 00", expect = "CD 1F D4" },
  { addr = 0xCA44, bytes = "00 00 00", expect = "CD 1F D4" },
]
call = 0xD425

[[cheats]]
id = "endless-lives"
label = "Endless lives"
hold = "lives"

[[cheats]]
id = "no-harm"
label = "No harm from enemies"
# Skips each of the three ways a touch takes a life (docs/re/starquake.md): a zapper's, the
# creature loop's, and deadly scenery's; and the creatures whose touch runs the energy timer
# faster add nothing to it.
patch = [
  { addr = 0xA56A, bytes = "00 00 00", expect = "C4 50 C3" },
  { addr = 0xA341, bytes = "C9 00 00 00", expect = "E1 C3 50 C3" },
  { addr = 0xCE79, bytes = "18", expect = "20" },
  { addr = 0xA349, bytes = "C6 00", expect = "C6 0A" },
]
note = "Stops zappers, creatures and deadly scenery taking a life, and creatures draining energy, when they touch BLOB."

# The pad.

[pad.default]
dpad = "joystick"
stick = "joystick"
west = "fire"
south = "build"
east = "pick-up"
north = "next-route"
start = { tap = ["SPACE"], frames = 2 }

[pad.title]
# The title takes its controls from 1 to 5 and starts on 0: Start chooses the Kempston joystick,
# then starts, so the pad drives BLOB from the first move. After 0 the game plays a tune until
# a key is pressed, so 0 comes again once it has begun (docs/re/starquake.md).
start = { sequence = ["1", "0", "0"], frames = 30 }

[[actions]]
id = "end-game"
label = "End this game"
# The guidance menu's row, in play: A S D F G held together end the game.
menu = "End this game"
menu_in = ["play"]
tap = ["A", "S", "D", "F", "G"]
frames = 5

[[actions]]
id = "pick-up"
label = "Pick up or swap"
joystick = ["up"]
# patch_for_frame = TODO: skip boarding the hover platform, so up only picks up
note = "Up, meaning only pick up or swap."

[[actions]]
id = "build"
label = "Build a platform"
joystick = ["down"]
# patch_for_frame = TODO: skip flying down, so down only builds
note = "Down, meaning only build."

[[actions]]
id = "next-route"
label = "Next route"
script = "next_route"
host_key = "Tab"

# Typing a teleport code with a pad.

[text_entry]
state = "booth"
letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ"
length = 5
# Just under the row the booth types the code on, 19 (docs/re/starquake.md).
card_row = 20
title_choose = "Choose a code"
title_spell = "Spell a code"
choices = "teleport-codes"
choices_from_level = 1
key_down_frames = 1
key_up_frames = 1

[persist.teleport-codes]
label = "teleport codes"
file = "teleporter-codes.txt"
add = "script"

[persist.doors-met]
label = "doors met"
# One a door: the game's seed, the room, and its three cards, as `seed:room:card-card-card`.
# Kept so a game continued from a save still lists the doors it met.
file = "doors-met.txt"
add = "script"
most = 256

# Typing the name for a high score with a pad.

[name_entry]
state = "name"
# The game takes a space too; the card shows it as an open box and types it on SPACE.
letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 "
length = 3
# Just under the game's three marks for the letters.
card_row = 18
title_choose = "Choose a name"
title_spell = "Spell a name"
choices = "names"
# The game makes a sound after each letter before it looks for the next: a key sooner is lost.
key_down_frames = 2
key_up_frames = 9

[persist.names]
label = "high-score names"
# Each name a game here put in the table, added as the table is read back.
file = "high-score-names.txt"

[high_scores]
title = "CORE OF HEROES"
# Best first. Each entry's last byte is the share of the planet explored, kept with it.
addr = 0x64FA
count = 8
stride = 10
name = { offset = 0, len = 3, type = "text" }
score = { offset = 3, len = 6, type = "digits" }

# Guidance: levels 0 to 6, then the panel's widgets.

[[guidance.levels]]
name = "Off"
description = "No guidance. Press Esc or Select to choose a level."

[[guidance.levels]]
name = "Codes and the core"
description = "The teleport codes you've seen, the doors' cards, and the core's pieces."

[[guidance.levels]]
name = "The map you have walked"
description = "A map of the rooms you've visited."

[[guidance.levels]]
name = "What you have seen"
description = "The items in the rooms you have walked through, core pieces still needed in pink."

[[guidance.levels]]
name = "What you have not"
description = "Items in the rooms you haven't reached."

[[guidance.levels]]
name = "Routes"
description = "The shortest way to the nearest missing piece, and to the core."

[[guidance.levels]]
name = "Everything"
description = "Every code, every door's cards, and the whole planet."

[[panel]]
kind = "icon-grid"
title = "CORE"
from_level = 1
column = "left"
columns = 3
pictures = "item_pictures"
source = "script:core"
empty = "Not seen yet"

[[panel]]
kind = "chip-list"
title = "TELEPORTS"
from_level = 1
column = "right"
font = "font"
source = "script:teleports"
empty = "None yet"

[[panel]]
kind = "card-set"
title = "DOORS"
from_level = 1
column = "right"
pictures = "item_pictures"
font = "font"
source = "script:doors"
empty = "None yet"

[[panel]]
kind = "map-grid"
from_level = 2
column = "left"
pictures = "item_pictures"
source = "script:map"
# The kinds of marker the script puts on the map, and the shape each is drawn as.
markers = { player = "player", teleport = "diamond", door = "label", piece = "picture", item = "picture", target = "ring" }
places = { teleport = "top-left" }

[situations]
# The routine that starts play in the current room (docs/re/starquake.md).
enter = 0xA426
# Its loading screen waits for a key; at the title, 0 starts a game.
start = ["SPACE", "0"]

[script]
file = "scripts/starquake.rhai"
