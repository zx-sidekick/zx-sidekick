[package]
name = "zx-sidekick-starquake"
description = "ZX Sidekick: Starquake, running your own copy of the original game. Not affiliated with the rights holders."
# Starquake's version, the same in its four crates (app, sidekick, sk-check,
# sk-lab); its release is tagged starquake-v<this>.
version = "0.3.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
sidekick.workspace = true
starquake.workspace = true
zx-core.workspace = true
zx-spectrum.workspace = true
pixels = "0.17"
winit = "0.30"
cpal = "0.18"
gilrs = "0.11"
# Reading the tape out of the zip the archives serve it in. Deflate only,
# through the pure-Rust zlib; the other methods and encryption stay out.
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# The screen that asks for the tape: text in the bundled Inter (see fonts/),
# and the system's own open-file dialog; and the message box a fatal startup
# error goes in, since a program started from a file manager has no console.
fontdue = "0.9"
rfd = "0.17"

[lints]
workspace = true
