[package]
name = "zx-sidekick-starquake"
description = "ZX Sidekick: Starquake, running your own copy of the original game. Not affiliated with the rights holders."
# Starquake's version, the same in its four crates (app, sidekick, starquake-check,
# starquake-lab); its release is tagged starquake-v<this>.
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
sidekick.workspace = true
sidekick-frontend.workspace = true
starquake.workspace = true
zx-core.workspace = true
# The window's keys, which the guidance panel takes some of; and the message
# box a fatal startup error goes in, since a program started from a file
# manager has no console.
winit.workspace = true
rfd.workspace = true

[lints]
workspace = true
